
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طقس سيدي إفني والبحر</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      padding: 16px;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      margin: 0;
      color: var(--accent);
      font-size: 1.5rem;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    .card h2 {
      margin-top: 0;
      font-size: 1.1rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .metric {
      display: flex;
      flex-direction: column;
    }
    .metric .label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .metric .value {
      font-size: 1.25rem;
      font-weight: bold;
      margin-top: 4px;
    }
    .status {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>طقس وحالة بحر سيدي إفني</h1>
    <p style="font-size:0.85rem; color:var(--text-muted);">التوقعات المباشرة للملاحة والصيد</p>
  </div>

  <div class="card">
    <h2>الطقس العام</h2>
    <div class="grid">
      <div class="metric">
        <span class="label">درجة الحرارة</span>
        <span class="value" id="temp">-- °C</span>
      </div>
      <div class="metric">
        <span class="label">سرعة الرياح</span>
        <span class="value" id="wind-speed">-- عقدة</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>حالة البحر والحرارة</h2>
    <div class="grid">
      <div class="metric">
        <span class="label">ارتفاع الموج</span>
        <span class="value" id="wave-height">-- م</span>
      </div>
      <div class="metric">
        <span class="label">فترة الموجة</span>
        <span class="value" id="wave-period">-- ثانية</span>
      </div>
    </div>
  </div>

  <div class="status" id="status-text">جاري تحميل البيانات...</div>

  <script src="cordova.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
