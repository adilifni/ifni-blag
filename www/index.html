<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windguru Sidi Ifni</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --text: #ffffff;
      --border: #444c56;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
    }

    #custom-splash {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      transition: opacity 0.4s ease;
      overflow: hidden;
    }
    #custom-splash img { width: 100%; height: 100%; object-fit: cover; }

    .header { text-align: center; margin-bottom: 12px; }
    .header h1 { margin: 0; font-size: 1.4rem; color: #79c0ff; font-weight: 800; }

    .sun-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .sun-times { display: flex; flex-direction: column; gap: 4px; font-weight: bold; font-size: 1.25rem; }
    .sun-up { color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    .sun-down { color: #f97316; display: flex; align-items: center; gap: 6px; }
    .sun-icon {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle, #f97316 0%, #eab308 100%);
      box-shadow: 0 0 14px rgba(234, 179, 8, 0.7);
    }
    
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab-btn {
      flex: 1; padding: 10px 4px; background: var(--card-bg);
      border: 1.5px solid var(--border); color: #c9d1d9;
      border-radius: 8px; font-weight: bold; font-size: 0.95rem;
    }
    .tab-btn.active { background: #1f6beb; color: #fff; border-color: #388bfd; }

    .table-container {
      overflow-x: auto; background: var(--card-bg);
      border: 1.5px solid var(--border); border-radius: 10px; padding: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .forecast-table { border-collapse: collapse; width: 100%; text-align: center; white-space: nowrap; font-size: 0.9rem; }
    .forecast-table th, .forecast-table td { padding: 8px 10px; border: 1px solid var(--border); }
    
    .row-title {
      position: sticky; right: 0;
      background: #21262d !important;
      color: #79c0ff;
      font-weight: 800;
      font-size: 0.95rem;
      text-align: right;
      z-index: 2;
      border-left: 2px solid var(--border) !important;
    }
    
    .day-header { background: #1f242c; color: #79c0ff; font-weight: bold; font-size: 0.95rem; }
    
    .wind-arrow {
      font-size: 1.4rem;
      font-weight: 900;
      color: #58a6ff;
      display: inline-block;
      line-height: 1;
    }

    .wind-low { background-color: #1e7e34; color: #ffffff; font-weight: bold; font-size: 0.95rem; }
    .wind-med { background-color: #d97706; color: #ffffff; font-weight: bold; font-size: 0.95rem; }
    .wind-high { background-color: #dc2626; color: #ffffff; font-weight: bold; font-size: 1rem; }

    .tide-chart-box {
      background: #090d16;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-top: 12px;
    }
    .tide-title { font-size: 1rem; font-weight: 800; color: #79c0ff; margin-bottom: 8px; text-align: center; }

    #no-internet-screen {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--bg); z-index: 9999; flex-direction: column;
      justify-content: center; align-items: center; padding: 24px; text-align: center;
    }
  </style>
</head>
<body>

  <div id="custom-splash">
    <img src="res/splash.png" alt="">
  </div>

  <div id="no-internet-screen">
    <div style="font-size:3rem; margin-bottom:16px;">⚠️</div>
    <div style="font-size:1.3rem; font-weight:bold;">لا يوجد اتصال بالإنترنت</div>
    <p style="color:#8b949e;">يرجى الاتصال بالشبكة للاطلاع على التوقعات.</p>
    <button onclick="checkAndLoad()" style="padding:10px 22px; background:#1f6beb; color:#fff; border:none; border-radius:8px; font-weight:bold;">إعادة المحاولة</button>
  </div>

  <div id="main-content">
    <div class="header">
      <h1>توقعات سيدي إفني (7 أيام)</h1>
    </div>

    <div class="sun-card">
      <div class="sun-times">
        <div class="sun-up"><span style="font-size:1.4rem;">⇑</span> <span id="sunrise-time">--:--</span></div>
        <div class="sun-down"><span style="font-size:1.4rem;">⇓</span> <span id="sunset-time">--:--</span></div>
      </div>
      <div class="sun-icon"></div>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchSection('all', this)">الكل</button>
      <button class="tab-btn" onclick="switchSection('weather', this)">الطقس والرياح</button>
      <button class="tab-btn" onclick="switchSection('marine', this)">البحر والمد</button>
    </div>

    <div class="table-container">
      <table class="forecast-table">
        <thead>
          <tr id="row-days"><th class="row-title">اليوم</th></tr>
          <tr id="row-hours"><th class="row-title">الساعة</th></tr>
        </thead>
        <tbody>
          <tr id="row-temp" class="sec-weather"><td class="row-title">الحرارة C°</td></tr>
          <tr id="row-wind" class="sec-weather"><td class="row-title">الرياح (عقدة)</td></tr>
          <tr id="row-dir" class="sec-weather"><td class="row-title">اتجاه الرياح</td></tr>
          <tr id="row-wave" class="sec-marine"><td class="row-title">الموج (متر)</td></tr>
          <tr id="row-period" class="sec-marine"><td class="row-title">فترة الموج (ث)</td></tr>
        </tbody>
      </table>
    </div>

    <div class="tide-chart-box sec-marine">
      <div class="tide-title">منحنى المد والجزر (اليوم)</div>
      <svg id="tide-svg" viewBox="0 0 500 150" style="width:100%; height:auto; overflow:visible;"></svg>
    </div>

    <div id="status" style="text-align:center; margin-top:12px; font-size:0.85rem; color:#8b949e;">جاري جلب البيانات...</div>
  </div>

  <script src="cordova.js"></script>
  <script src="js/index.js"></script>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const splash = document.getElementById('custom-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 400);
        }
      }, 1200);
    });
  </script>
</body>
</html>
